# A single CI script with github workflow
name: Tests

on:
  push:
  merge_group:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    uses: qiboteam/workflows/.github/workflows/test.yml@uv
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      uv-extras: "--no-dev --group test --group analysis"
    secrets: inherit
