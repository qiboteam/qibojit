[project]
name = "qibojit"
version = "0.1.18"
description = "Simulation tools based on numba and cupy."
authors = [{ name = "The Qibo team" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.14"
keywords = []
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numba>=0.61.0,<0.62.0",
  "qibo>=0.3.6,<0.4.0",
  "scipy>=1.10.1,<2.0.0",
  "psutil>=5.9.5,<6.0.0",
]

[project.urls]
Homepage = "https://qibo.science"
Repository = "https://github.com/qiboteam/qibojit"
Documentation = "https://qibo.science/docs/qibo/stable"

[dependency-groups]
test = [
  "pytest>=7.3.1,<10.0.0",
  "pylint>=3.0.3,<4.0.0",
  "pytest-cov>=4.1.0,<5.0.0",
  "pytest-env>=0.8.1,<0.9.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.poe.tasks]
test = "pytest"
lint = "pylint src/**/*.py -E"
lint-warnings = "pylint src/**/*.py --exit-zero"

[tool.pylint.master]
output-format = "colorized"

[tool.pylint.reports]
output-format = "colorized"

[tool.coverage.run]
omit = ["src/qibojit/backends/clifford_operations*", "src/qibojit/custom_operators/quantum_info.py"]

[tool.pytest.ini_options]
testpaths = ['tests/']
addopts = ['--cov=qibojit', '--cov-report=xml', '--cov-report=html']
env = ["D:NUMBA_DISABLE_JIT=1"]
filterwarnings = [
    "ignore::scipy.sparse.SparseEfficiencyWarning",
]
