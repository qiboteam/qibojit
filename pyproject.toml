[project]
name = "qibojit"
version = "0.1.18"
description = "Simulation tools based on numba and cupy."
authors = [{ name = "The Qibo team" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.16"
keywords = []
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numba>=0.68.0,<0.69.0",
  "qibo>=0.3.6,<0.4.0",
  "scipy>=1.18.1,<2.0.0",
  "psutil>=5.9.5,<6.0.0",
]

[project.urls]
Homepage = "https://qibo.science"
Repository = "https://github.com/qiboteam/qibojit"
Documentation = "https://qibo.science/docs/qibo/stable"

# Temporary: pull qibo from the `uvupgrade` branch (0.3.7, supports 3.12-3.15)
# until it is published to PyPI. Remove this override once qibo 0.3.7 is released.
[tool.uv.sources]
qibo = { git = "https://github.com/qiboteam/qibo.git", branch = "uvupgrade" }

[dependency-groups]
test = [
  "pytest>=7.3.1,<10.0.0",
  "pytest-cov>=4.1.0,<5.0.0",
  "pytest-env>=0.8.1,<0.9.0",
]
analysis = ["ruff>=0.16.5,<0.18.0"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.poe.tasks]
test = "pytest"
lint = "ruff check"
lint-warnings = """
  ruff check --exit-zero \
  --select F,E,W,C90,N,UP,BLE,FBT,B,A,C4,T10,EM,EXE,ISC,ICN,LOG,G,INP,PIE,T20,PT,Q,RSE,\
           RET,SLF,SLOT,SIM,TC,INT,ARG,PTH,ERA,NPY,PERF,RUF
"""

[tool.coverage.run]
omit = ["src/qibojit/backends/clifford_operations*", "src/qibojit/custom_operators/quantum_info.py"]

[tool.pytest.ini_options]
testpaths = ['tests/']
addopts = ['--cov=qibojit', '--cov-report=xml', '--cov-report=html']
env = ["D:NUMBA_DISABLE_JIT=1"]
filterwarnings = [
    "ignore::scipy.sparse.SparseEfficiencyWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/qibojit/backends/clifford_operations_cpu.py" = ["N802"]
"src/qibojit/backends/clifford_operations_gpu.py" = ["N802", "N816"]
"src/qibojit/backends/matrices.py" = ["N802", "E743"]
"src/qibojit/custom_operators/quantum_info.py" = ["N803", "N806", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["qibojit"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
